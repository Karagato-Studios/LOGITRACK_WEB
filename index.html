<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karagato Studios - Official Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .hub-container {
            background-color: #1a1a1a;
            padding: 50px;
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #00ffcc;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        p { color: #888; margin-bottom: 30px; }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .btn-policy {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
        }
        .btn-policy:hover {
            background: #00ffcc;
            color: #000;
        }
        .btn-terms {
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
        }
        .btn-terms:hover {
            background: #ff00ff;
            color: #000;
        }
        .btn-deletion {
            background: transparent;
            border: 1px solid #ffff00;
            color: #ffff00;
        }
        .btn-deletion:hover {
            background: #ffff00;
            color: #000;
        }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>Karagato Studios</h1>
        <p>Independent App Development & Creative Solutions</p>
        
        <div class="nav-links">
            <a href="privacy_policy.html" class="btn btn-policy">Política de Privacidad</a>
            <a href="terms_and_conditions.html" class="btn btn-terms">Términos del Servicio</a>
            <a href="deletion.html" class="btn btn-deletion">Eliminación de Datos</a>
        </div>

        <div class="footer">
            &copy; 2026 Karagato Studios | Built for Android & Beyond
        </div>
    </div>
</body>
</html>
